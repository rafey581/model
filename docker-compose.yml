services:
  postgres:
    image: postgres:16-alpine
    container_name: snooker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snooker
      POSTGRES_PASSWORD: snooker
      POSTGRES_DB: snooker
    # Localhost only. The API on this machine uses localhost:5432. Do not publish
    # 5432 on a public interface; the password above is a fixed dev default.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snooker -d snooker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: snooker-redis
    restart: unless-stopped
    # Provisioned for later use. Nothing in the server reads it today.
    # `pnpm db:up` starts postgres only.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
