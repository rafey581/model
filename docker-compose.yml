services:
  postgres:
    image: postgres:16-alpine
    container_name: snooker-postgres
    environment:
      POSTGRES_USER: snooker
      POSTGRES_PASSWORD: snooker
      POSTGRES_DB: snooker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: snooker-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: