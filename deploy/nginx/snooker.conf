# Snooker Stake API reverse proxy.
#
# The Node process listens on 127.0.0.1:4000 (API + Socket.IO). This file is what
# players and staff apps should hit once a domain exists.
#
#   sudo cp deploy/nginx/snooker.conf /etc/nginx/sites-available/snooker
#   sudo ln -sf /etc/nginx/sites-available/snooker /etc/nginx/sites-enabled/snooker
#   # set server_name, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com
#
# After certificates are in place:
#   1. packages/server/.env → TRUST_PROXY=true, then restart the snooker service.
#   2. Rebuild both apps with https://api.example.com (player) and
#      https://api.example.com/api (staff). See DEPLOY.md.
#   3. Close inbound port 4000 on the EC2 security group. Leave 22 for your IP,
#      and 80/443 for the world. Never open 5432.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.example.com;

    # Deposit proofs are base64 inside JSON. The API allows about 8.5 MB
    # (4 MB image cap, doubled for encoding). The default nginx body limit is 1 MB,
    # which rejects a normal phone screenshot.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Optional: serve the player web build from this same host.
    # Build with an empty VITE_API_ORIGIN so the page calls /api on this origin.
    # Uncomment root + locations, then `sudo nginx -t && sudo systemctl reload nginx`.
    #
    # root /home/ubuntu/snooker/packages/client/dist;
    # location / {
    #     try_files $uri /index.html;
    # }
    # location ~* \.glb$ {
    #     types { model/gltf-binary glb; }
    #     gzip on;
    #     gzip_types model/gltf-binary;
    # }
}
