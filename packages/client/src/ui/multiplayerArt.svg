<?xml version="1.0" encoding="UTF-8"?>
<!--
  The multiplayer card's artwork: two cues crossed over a red, with the VS badge.

  Its own file so it can be swapped for a photograph later without touching the lobby:
  `lobbyModel.ts` imports it as a string and the card renders whatever it is given.

  Drawn to match `bot.png` and `tournament.png` on the things that can be measured rather
  than seen: both of those are RGBA with real transparency and no white plate behind them,
  so this is transparent too and the same square-ish footprint as the bot (450x450) - which
  is what makes the three cards read as one set once they are cropped to the same width.

  Every surface that has to look round is a gradient, not a flat fill: the shafts are
  linear gradients across their width so they catch the light like cylinders, and the ball
  is a radial gradient with the light source at the upper left.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Two crossed cue sticks and a red snooker ball">
  <defs>
    <!-- Cue shaft: pale ash on the lit edge, walnut in the middle, near-black on the
         far edge. The gradient runs across the shaft's short side so it reads as round. -->
    <linearGradient id="mx-shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2416" />
      <stop offset="0.16" stop-color="#8a5a30" />
      <stop offset="0.42" stop-color="#d9a867" />
      <stop offset="0.62" stop-color="#b3793f" />
      <stop offset="1" stop-color="#4a2e19" />
    </linearGradient>

    <!-- The butt below the joint: darker, and it takes the same light on the same side so
         the two halves of one cue agree about where the light is. -->
    <linearGradient id="mx-butt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#150d08" />
      <stop offset="0.2" stop-color="#4a2418" />
      <stop offset="0.45" stop-color="#7d3f27" />
      <stop offset="0.7" stop-color="#3a1c12" />
      <stop offset="1" stop-color="#120a06" />
    </linearGradient>

    <!-- Malchite-and-brass: one banded gradient rather than three flat rings, so the ring
         around the joint has its own highlight travelling across it. -->
    <linearGradient id="mx-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a20" />
      <stop offset="0.35" stop-color="#e8c872" />
      <stop offset="0.6" stop-color="#c9a84c" />
      <stop offset="1" stop-color="#7d5f1c" />
    </linearGradient>

    <linearGradient id="mx-ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a98a" />
      <stop offset="0.45" stop-color="#f6efdd" />
      <stop offset="1" stop-color="#9c8c6d" />
    </linearGradient>

    <linearGradient id="mx-chalk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4f86" />
      <stop offset="0.45" stop-color="#5aa0e0" />
      <stop offset="1" stop-color="#16396a" />
    </linearGradient>

    <!-- The ball. Three stops rather than two: the light, the mid red, and a dark rim on
         the far side so it is a sphere in a room and not a red circle. -->
    <radialGradient id="mx-ball" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#ff8f7a" />
      <stop offset="0.22" stop-color="#e8332a" />
      <stop offset="0.62" stop-color="#b3140f" />
      <stop offset="0.88" stop-color="#6d0a08" />
      <stop offset="1" stop-color="#3d0504" />
    </radialGradient>

    <!-- The bounce light from below-right, which is what stops the lower edge of the ball
         going dead. -->
    <radialGradient id="mx-ball-rim" cx="0.74" cy="0.86" r="0.4">
      <stop offset="0" stop-color="#ff6a52" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ff6a52" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mx-spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="mx-badge" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f0d489" />
      <stop offset="0.5" stop-color="#c9a84c" />
      <stop offset="1" stop-color="#8d6d24" />
    </linearGradient>

    <!-- One soft shadow, cast by the whole group. Kept as a blur rather than an opacity
         trick because the cues and the ball are at different depths. -->
    <filter id="mx-drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>

  <g filter="url(#mx-drop)">
    <!-- The two cues, crossed. Drawn butt-to-tip as one group and mirrored for the second
         so the pair is symmetric and neither is a copy that happens to be rotated. -->
    <g transform="rotate(34 256 214)">
      <!-- tip, ferrule, shaft, gold ring, butt: the order a real cue is assembled in. -->
      <rect x="58" y="205" width="20" height="18" rx="5" fill="url(#mx-chalk)" />
      <rect x="78" y="204" width="34" height="20" rx="3" fill="url(#mx-ferrule)" />
      <rect x="112" y="203" width="238" height="22" rx="8" fill="url(#mx-shaft)" />
      <rect x="350" y="200" width="13" height="28" rx="4" fill="url(#mx-gold)" />
      <rect x="363" y="199" width="96" height="30" rx="10" fill="url(#mx-butt)" />
      <!-- the rubber bumper at the very end of the butt -->
      <rect x="452" y="203" width="14" height="22" rx="7" fill="#1a1009" />
    </g>

    <g transform="rotate(-34 256 214) scale(-1 1) translate(-512 0)">
      <rect x="58" y="205" width="20" height="18" rx="5" fill="url(#mx-chalk)" />
      <rect x="78" y="204" width="34" height="20" rx="3" fill="url(#mx-ferrule)" />
      <rect x="112" y="203" width="238" height="22" rx="8" fill="url(#mx-shaft)" />
      <rect x="350" y="200" width="13" height="28" rx="4" fill="url(#mx-gold)" />
      <rect x="363" y="199" width="96" height="30" rx="10" fill="url(#mx-butt)" />
      <rect x="452" y="203" width="14" height="22" rx="7" fill="#1a1009" />
    </g>

    <!-- The red, in front of both cues. -->
    <g>
      <circle cx="256" cy="300" r="82" fill="url(#mx-ball)" />
      <circle cx="256" cy="300" r="82" fill="url(#mx-ball-rim)" />
      <!-- two speculars: the small hard one is the light, the large soft one is the
           window it is bouncing off -->
      <ellipse cx="226" cy="266" rx="26" ry="19" fill="url(#mx-spec)" transform="rotate(-28 226 266)" />
      <ellipse cx="288" cy="330" rx="40" ry="24" fill="url(#mx-spec)" opacity="0.28" transform="rotate(-28 288 330)" />
      <!-- the contact shadow the ball puts on the cue it is resting against -->
      <ellipse cx="256" cy="374" rx="66" ry="12" fill="#000000" opacity="0.3" />
    </g>

    <!-- The badge, sat below the ball rather than over it, so it never covers the
         highlight that makes the ball look round. -->
    <g transform="translate(0 6)">
      <rect x="196" y="404" width="120" height="52" rx="26" fill="url(#mx-badge)" />
      <rect x="196" y="404" width="120" height="52" rx="26" fill="none" stroke="#7d5f1c" stroke-width="2" opacity="0.6" />
      <text
        x="256"
        y="440"
        text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="30"
        font-weight="700"
        letter-spacing="4"
        fill="#241a06"
      >VS</text>
    </g>
  </g>
</svg>
