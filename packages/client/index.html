<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <!--
      An inline SVG rather than a file, so the icon needs no route and no build step.
      The SVG is percent-encoded because a raw space is not legal inside a data URI
      and browsers truncate the URL at the first one, leaving a broken icon.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%2032%2032'><circle cx='16' cy='16' r='14' fill='%230a0a0f'/><circle cx='16' cy='16' r='11' fill='%23c9a84c'/><circle cx='12.5' cy='12.5' r='3.2' fill='%23e8c872'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Snooker Arena</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
